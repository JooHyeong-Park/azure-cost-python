# 조회 기간을 생략하면 실행일 기준 7일 전 하루를 조회합니다.
# YYYYMMDD 또는 YYYY-MM-DD 형식을 지원합니다.
# start_date = "20250601"
# end_date = "20260531"

[[targets]]
# 조회 대상 구독
subscription_id = "00000000-0000-0000-0000-000000000000"

# CSV 의 SubscriptionName 컬럼 값
subscription_name = "Sandbox Nonprod"

# 선택 필터
# Resource Group 과 Resource Type 은 API 요청에 적용
# Resource ID prefix 는 API 응답에 적용
# resource_groups = ["rg-example"]
# resource_types = ["microsoft.storage/storageaccounts"]
# resource_id_prefixes = ["/subscriptions/.../providers/..."]

# 추가 조회 대상
[[targets]]
subscription_id = "11111111-1111-1111-1111-111111111111"
subscription_name = "Subscription B"

[generate]
type = "csv"
# CSV 파일명 앞에 붙는 접두어 (기본: "_raw-cost")
file_prefix = "_raw-cost"
# 선택: 임시 CSV 작성 경로
# blob 마운트처럼 네트워크 저장소에는 최종 파일만 한 번 기록됩니다.
temp_dir = "C:/tmp/azure-cost"

[save]
output_dir = "./raw-cost"
